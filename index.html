<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nezzy Cake</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; user-select: none; }
        body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; padding-bottom: 70px; }
        .tg-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; background: #1e293b; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #334155; }
        .tg-header h1 { font-size: 18px; font-weight: 700; color: #fff; }
        .search-box { padding: 10px 16px; background: #111827; }
        .search-input { width: 100%; background: #1f2937; border: none; border-radius: 20px; padding: 10px 16px; color: #fff; font-size: 13px; outline: none; }
        .chat-list { padding: 4px 0; }
        .chat-item { display: flex; align-items: center; padding: 12px 16px; gap: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; }
        .chat-item:active { background: rgba(255,255,255,0.05); }
        .chat-avatar { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 1px solid #334155; flex-shrink: 0; }
        .chat-info { flex-grow: 1; min-width: 0; }
        .chat-name { font-size: 14px; font-weight: 600; color: #f1f5f9; }
        .chat-snippet { font-size: 12px; color: #94a3b8; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .tg-bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 60px; background: #1e293b; border-top: 1px solid #334155; display: flex; justify-content: space-around; align-items: center; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #64748b; font-size: 11px; cursor: pointer; flex: 1; }
        .nav-item.active { color: #3b82f6; }
        .nav-icon { font-size: 20px; margin-bottom: 2px; }
    </style>
</head>
<body>

    <div class="tg-header">
        <h1>Nezzy Cake ✨</h1>
    </div>

    <div class="search-box">
        <input type="text" id="searchInput" class="search-input" placeholder="Tortlarni qidirish..." oninput="filterCakes(this.value)">
    </div>

    <div class="chat-list" id="chatList"></div>

    <div class="tg-bottom-nav">
        <div class="nav-item active" onclick="alert('Chatlar sahifasi')">
            <span class="nav-icon">💬</span>
            <span>Chatlar</span>
        </div>
        <div class="nav-item" onclick="alert('Admin: @shaxjan_2 \nTel: +998 94 026 80 01')">
            <span class="nav-icon">👥</span>
            <span>Kontaktlar</span>
        </div>
        <div class="nav-item" onclick="alert('Narxlar: 70 000 so\'mdan boshlanadi')">
            <span class="nav-icon">⚙️</span>
            <span>Sozlamalar</span>
        </div>
        <div class="nav-item" onclick="alert('Profil: Shakhzodbek Ulmasov \nBio: Nezzy Cake mijoziman ✨')">
            <span class="nav-icon">👤</span>
            <span>Profil</span>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready(); tg.expand();

        const cakes = [
            { img: "https://i.ibb.co/3mkvdmvv/IMG-20261026-023135-855.jpg", title: "Bento Master Cake ✨", text: "Narxi: 70 000 so'm - 5-6 kishilik" },
            { img: "https://i.ibb.co/35fYH6yw/IMG-20261026-023126-461.jpg", title: "Qulupnayli Tort 🍓", text: "Narxi: 125 000 so'm - Bayramona" },
            { img: "https://i.ibb.co/Mk7ZcDcG/IMG-20261025-133515-233.jpg", title: "Tug'ilgan kun torti 🎂", text: "Narxi: 100 000 so'm - Maxsus dizayn" },
            { img: "https://i.ibb.co/FqkFZgMQ/IMG-20261022-180610-962.jpg", title: "Shokoladli Premium 🍫", text: "Narxi: 170 000 so'm - Katta tort" },
            { img: "https://i.ibb.co/RTxc4k0F/IMG-20261022-180550-276.jpg", title: "Meva bezakli yubiley torti 🍇", text: "Buyurtma berish uchun bosing" },
            { img: "https://i.ibb.co/5gmmHjMt/IMG-20261021-005548-527.jpg", title: "Dizaynli to'y torti 💍", text: "Maxsus ko'p qavatli tort" }
        ];

        function renderCakes(list) {
            const container = document.getElementById('chatList');
            container.innerHTML = '';
            list.forEach(c => {
                container.innerHTML += `
                    <div class="chat-item" onclick="tg.showAlert('Buyurtma berish uchun botga qayting!')">
                        <img src="${c.img}" class="chat-avatar">
                        <div class="chat-info">
                            <div class="chat-name">${c.title}</div>
                        <div class="chat-snippet">${c.text}</div>
                        </div>
                    </div>
                `;
            });
        }

        renderCakes(cakes);

        function filterCakes(query) {
            const filtered = cakes.filter(c => c.title.toLowerCase().includes(query.toLowerCase()));
            renderCakes(filtered);
        }
    </script>
</body>
</html>
