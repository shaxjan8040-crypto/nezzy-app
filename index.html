<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nezzy Premium</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #1c1c1e;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .card {
            background: #2c2c2e;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        button {
            background-color: #007aff;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>
    <h1>Welcome to Nezzy Premium! ✨</h1>
    
    <div class="card">
        <h3>Xizmatlarimiz</h3>
        <p>Ajoyib mahsulotlar va xizmatlar to'plami.</p>
        <button onclick="Telegram.WebApp.showAlert('Tez orada yangi xizmatlar qo\'shiladi!')">Batafsil</button>
    </div>

    <script>
        Telegram.WebApp.ready();
        Telegram.WebApp.expand(); // Ekranni to'liq ochish
    </script>
</body>
</html>
