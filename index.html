<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Telegram - Nezzy Cake</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            user-select: none;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            padding-bottom: 70px;
            overflow-x: hidden;
        }

        /* TELEGRAM HEADER */
        .tg-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: #1e293b;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #334155;
        }

        .tg-header h1 {
            font-size: 20px;
            font-weight: 700;
            color: #fff;
        }

        .tg-dots {
            font-size: 20px;
            color: #94a3b8;
            cursor: pointer;
            padding: 0 5px;
        }

        /* STORIES (HIKOYALAR) QISMI */
        .stories-container {
            display: flex;
            gap: 12px;
            padding: 12px 16px;
            overflow-x: auto;
            background: #111827;
            border-bottom: 1px solid #1f2937;
        }

        .stories-container::-webkit-scrollbar { display: none; }

        .story-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            flex-shrink: 0;
        }

        .story-ring {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            padding: 2px;
            background: linear-gradient(135deg, #ffd700, #ff4500);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .story-img {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #111827;
        }

        .story-name {
            font-size: 11px;
            margin-top: 4px;
            color: #cbd5e1;
            max-width: 60px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            text-align: center;
        }

        /* SEARCH BAR */
        .search-box {
            padding: 10px 16px;
            background: #111827;
        }

        .search-input {
            width: 100%;
            background: #1f2937;
            border: none;
            border-radius: 20px;
            padding: 10px 16px 10px 40px;
            color: #fff;
            font-size: 13px;
            outline: none;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="%2394a3b8" viewBox="0 0 16 16"><path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.098zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/></svg>');
            background-repeat: no-repeat;
            background-position: 14px center;
        }

        /* FILTER TABS */
        .filter-tabs {
            display: flex;
            gap: 8px;
            padding: 0 16px 10px 16px;
            background: #111827;
            overflow-x: auto;
        }
        .filter-tabs::-webkit-scrollbar { display: none; }

        .filter-badge {
            background: #1f2937;
            padding: 6px 14px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 600;
            color: #94a3b8;
            cursor: pointer;
            white-space: nowrap;
        }

        .filter-badge.active {
            background: #3b82f6;
            color: #fff;
        }

        /* CHAT LIST (KATALOG) */
        .chat-list {
            padding: 4px 0;
        }

        .chat-item {
            display: flex;
            align-items: center;
            padding: 10px 16px;
            gap: 12px;
            cursor: pointer;
            transition: background 0.15s;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }

        .chat-item:active {
            background: rgba(255,255,255,0.05);
        }

        .chat-avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            border: 1px solid #334155;
        }

        .chat-info {
            flex-grow: 1;
            min-width: 0;
        }

        .chat-title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .chat-name {
            font-size: 14px;
            font-weight: 600;
            color: #f1f5f9;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-time {
            font-size: 11px;
            color: #64748b;
        }

        .chat-snippet {
            font-size: 12px;
            color: #94a3b8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* FLOATING ACTION BUTTON (+) */
        .fab-btn {
            position: fixed;
            bottom: 76px;
            right: 16px;
            width: 52px;
            height: 52px;
            background: #3b82f6;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 26px;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
            cursor: pointer;
            z-index: 99;
        }

        /* TELEGRAM BOTTOM NAVIGATION BAR */
        .tg-bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: #1e293b;
            border-top: 1px solid #334155;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #64748b;
            cursor: pointer;
            font-size: 11px;
            font-weight: 500;
            position: relative;
            flex: 1;
        }

        .nav-item.active {
            color: #3b82f6;
        }

        .nav-icon {
            font-size: 20px;
            margin-bottom: 2px;
        }

        .nav-badge {
            position: absolute;
            top: 0;
            right: 22%;
            background: #3b82f6;
            color: #fff;
            font-size: 9px;
            padding: 1px 5px;
            border-radius: 10px;
            font-weight: 700;
        }

        /* SUB-PAGES (SECTIONS) */
        .section-page {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: #0f172a;
            z-index: 1000;
            overflow-y: auto;
            padding: 16px;
        }

        .sec-header {
            display
